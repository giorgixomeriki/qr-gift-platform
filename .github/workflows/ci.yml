name: CI

# See docs/CI.md for what this workflow does and why. It never touches a
# production resource: everything here is a throwaway local Supabase stack
# started fresh on the runner and discarded when the job ends.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # GitHub's own default is 360 minutes — far too generous for a workflow
    # that should never take more than a few. A genuine hang (e.g. `supabase
    # start` never becoming healthy) should fail fast, not burn CI minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        # A dummy-but-valid config — `next build` compiles and type-checks the
        # app but never opens a DB connection, so no live Supabase is needed
        # for this step. PAYMENTS_PROVIDER=TEST and NODE_ENV are left for
        # Next.js to set itself (never hardcoded — see README's own note on
        # why a hardcoded NODE_ENV broke a production build previously).
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://ci-placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-anon-key"
          SUPABASE_SERVICE_ROLE_KEY: "ci-placeholder-service-role-key"
          EDIT_TOKEN_SECRET: "ci-placeholder-edit-token-secret-value"
          PAYMENTS_PROVIDER: "TEST"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Export local Supabase connection details
        # These are freshly generated by `supabase start` for THIS runner only
        # and torn down with it — never a production credential, never
        # persisted, never printed with --secret masking bypassed. The
        # app_runtime DB password is the fixed LOCAL-DEV-ONLY value already
        # committed in src/db/migrations/0001_rls_and_functions.sql (see that
        # file's own comment on why it's safe to be public) — not a secret.
        run: |
          STATUS=$(supabase status -o json)
          echo "NEXT_PUBLIC_SUPABASE_URL=$(echo "$STATUS" | jq -r '.API_URL')" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(echo "$STATUS" | jq -r '.ANON_KEY')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$STATUS" | jq -r '.SERVICE_ROLE_KEY')" >> "$GITHUB_ENV"
          echo "MIGRATIONS_DATABASE_URL=$(echo "$STATUS" | jq -r '.DB_URL')" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://app_runtime:HH1mUPcwnyz1NGyM8jbeLsQqbwc@127.0.0.1:54322/postgres" >> "$GITHUB_ENV"
          echo "SUPABASE_STORAGE_BUCKET=greeting-media" >> "$GITHUB_ENV"
          echo "EDIT_TOKEN_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_APP_URL=http://localhost:3000" >> "$GITHUB_ENV"
          echo "PAYMENTS_PROVIDER=TEST" >> "$GITHUB_ENV"

      - name: Apply migrations
        run: npm run db:migrate

      - name: Seed reference data
        run: npm run db:seed

      - name: Run all verify:* integration suites
        # GitHub Actions' documented default shell for `run:` steps is
        # already `bash -e` (plus pipefail), so `npm run "$script"` failing
        # should already fail this step and the job. `set -e` is added here
        # explicitly anyway — not because a failure was observed slipping
        # through, but so this doesn't silently depend on a reader already
        # knowing that default.
        run: |
          set -e
          for script in $(node -e "console.log(Object.keys(require('./package.json').scripts).filter(s => s.startsWith('verify:')).join('\n'))"); do
            echo "::group::npm run $script"
            npm run "$script"
            echo "::endgroup::"
          done

      - name: Stop Supabase
        if: always()
        run: supabase stop
